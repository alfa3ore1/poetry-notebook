<!doctype html>
<html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دفتر القصائد</title><style>body{font:18px system-ui;background:#f6f2eb;color:#27231d;max-width:800px;margin:auto;padding:24px}h1{color:#60482e}input,textarea,button{font:inherit;padding:10px;border:1px solid #cbbda8;border-radius:8px;box-sizing:border-box}input,textarea{width:100%;margin:6px 0 14px}textarea{height:170px}button{cursor:pointer;background:#60482e;color:white;margin:5px}article{background:white;border:1px solid #e0d6c7;border-radius:10px;padding:16px;margin:12px 0}pre{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere}.small{font-size:14px;color:#645c50}</style>
<h1>دفتر القصائد</h1><p>احفظ قصائدك وابحث فيها على جهازك.</p><p class="small">القصائد محفوظة في هذا المتصفح فقط. قد تُحذف عند مسح بياناته؛ صدّر نسخة احتياطية بانتظام. لا تُرفع القصائد إلى خادم.</p><form id="form"><label>عنوان القصيدة<input id="title" required maxlength="200"></label><label>نص القصيدة<textarea id="body" required></textarea></label><button>حفظ القصيدة</button><button type="button" id="cancel" hidden>إلغاء التعديل</button></form><label>البحث<input id="search" placeholder="ابحث في العنوان أو النص"></label><button id="export">تصدير نسخة JSON</button><label>استيراد نسخة JSON <input type="file" id="import" accept="application/json,.json"></label><div id="list"></div><script>
const key='poetry-organizer-v1';let poems=[];try{const data=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(data))poems=data}catch{alert('تعذرت قراءة البيانات المحفوظة. لا تحفظ أي تغييرات قبل استعادة نسخة احتياطية.')}let editing=null;const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(key,JSON.stringify(poems));return true}catch{alert('تعذر الحفظ على الجهاز. قد تكون مساحة التخزين ممتلئة.');return false}}function render(){const q=$('search').value.trim().toLocaleLowerCase();$('list').replaceChildren();poems.filter(p=>(p.title+' '+p.body).toLocaleLowerCase().includes(q)).forEach(p=>{let a=document.createElement('article'),h=document.createElement('h2'),t=document.createElement('pre'),e=document.createElement('button'),d=document.createElement('button');h.textContent=p.title;t.textContent=p.body;e.textContent='تعديل';d.textContent='حذف';e.onclick=()=>{editing=p.id;$('title').value=p.title;$('body').value=p.body;$('cancel').hidden=false;window.scrollTo(0,0)};d.onclick=()=>{if(confirm('هل تريد حذف هذه القصيدة؟')){let old=poems;poems=poems.filter(x=>x.id!==p.id);if(!save())poems=old;render()}};a.append(h,t,e,d);$('list').append(a)})}function reset(){editing=null;$('form').reset();$('cancel').hidden=true}$('form').onsubmit=e=>{e.preventDefault();let old=poems.slice();let p={id:editing||String(Date.now())+'-'+Math.random().toString(36).slice(2),title:$('title').value.trim(),body:$('body').value.trim()};if(!p.title||!p.body)return;poems=editing?poems.map(x=>x.id===editing?p:x):[p,...poems];if(save())reset();else poems=old;render()};$('cancel').onclick=reset;$('search').oninput=render;$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(poems,null,2)],{type:'application/json'}));a.download='poems-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onchange=async e=>{try{let data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data)||!data.every(x=>x&&typeof x.id==='string'&&typeof x.title==='string'&&typeof x.body==='string')||new Set(data.map(x=>x.id)).size!==data.length)throw Error();if(confirm('سيستبدل الاستيراد جميع القصائد الحالية. هل صدّرت نسخة احتياطية؟')){let old=poems;poems=data;if(!save())poems=old;reset();render()}}catch{alert('الملف غير صالح. اختر نسخة JSON مصدّرة من دفتر القصائد.')}e.target.value=''};render();</script></html>
